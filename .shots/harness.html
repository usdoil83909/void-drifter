<!DOCTYPE html>
<!-- Local screenshot harness (NOT part of the shipped game). Drives the real game code. -->
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../game/styles.css"></head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-row">
    <div class="hud-block"><div class="hud-label">HULL</div><div class="bar"><div id="hull-fill" class="bar-fill hull"></div></div></div>
    <div class="hud-block"><div class="hud-label">SHIELD</div><div class="bar"><div id="shield-fill" class="bar-fill shield"></div></div></div>
    <div class="hud-spacer"></div>
    <div class="hud-stat">SCORE <span id="score">0</span></div>
    <div class="hud-stat">CRYSTALS <span id="crystals">0</span></div>
    <div class="hud-stat">WAVE <span id="wave">1</span></div>
  </div>
  <div id="boss-wrap" class="boss-wrap" style="display:none">
    <div class="hud-label">GUARDIAN</div>
    <div class="bar boss"><div id="boss-fill" class="bar-fill boss"></div></div>
  </div>
</div>

<div id="warning"></div>
<div id="overlay"></div>
<script src="../game/input.js"></script>
<script src="../game/audio.js"></script>
<script src="../game/particles.js"></script>
<script src="../game/entities.js"></script>
<script src="../game/waves.js"></script>
<script src="../game/hud.js"></script>
<script src="../game/states.js"></script>
<script src="../game/game.js"></script>
<script>
(function(){
  const mode = location.hash.replace('#','') || 'title';
  const V = () => window.VD;
  setTimeout(() => {
    const VD = V(), g = VD.g;
    if (mode === 'title') return; // default TITLE state
    g.reset();
    VD.States.set('PLAYING', g);
    if (mode === 'play') {
      // fast-forward into wave 2 with some action
      g.score = 1450; g.crystalCount = 7; g.wave = 2;
      g.player.hull = 72; g.player.x = 640; g.player.y = 400; g.player.vx = 0; g.player.vy = 0; g.player.angle = -Math.PI/2;
      VD.Waves.start(2, g);
      // stage a lively scene: asteroids and crystals clustered around the ship
      const mk = (x, y, s) => { const a = new VD.Asteroid(g); a.x = x; a.y = y; a.s = s; a.r = 18 + s * 10; a.vx = 0; a.vy = 0; a.rot = Math.random() * 6.28; a.spin = 0.2; g.asteroids.push(a); return a; };
      mk(430, 300, 2); mk(820, 260, 1); mk(700, 560, 3); mk(360, 520, 1); mk(920, 480, 2); mk(560, 560, 2); mk(760, 200, 1);
      const ck = (x, y) => { const c = new VD.Crystal(g); c.x = x; c.y = y; c.vx = 0; c.vy = 0; g.crystalList.push(c); return c; };
      ck(560, 300); ck(760, 380); ck(500, 480);
      const hk = new VD.Hunter(g); hk.x = 860; hk.y = 340; hk.vx = 0; hk.vy = 0; g.hunters.push(hk);
      // freeze staged objects so the scene stays composed at capture time
      setInterval(() => {
        g.asteroids.forEach(a => { a.vx = 0; a.vy = 0; });
        g.crystalList.forEach(c => { c.vx = 0; c.vy = 0; });
        if (g.hunters[0]) { g.hunters[0].vx = 0; g.hunters[0].vy = 0; }
      }, 50);
      // keep shooting via synthetic input
      setInterval(() => {
        window.dispatchEvent(new KeyboardEvent('keydown', {key:' '}));
        setTimeout(() => window.dispatchEvent(new KeyboardEvent('keyup', {key:' '})), 60);
      }, 160);
    } else if (mode === 'gameover') {
      g.score = 2130; g.wave = 4; g.player.hull = 0;
      VD.States.set('GAMEOVER', g);
    } else if (mode === 'victory') {
      g.score = 8740; g.wave = 10;
      VD.States.set('VICTORY', g);
    } else if (mode === 'boss') {
      g.wave = 10; g.score = 6200; g.player.x = 640; g.player.y = 480;
      VD.Waves.start(10, g);
      if (g.boss) { g.boss.x = 640; g.boss.y = 260; g.boss.entering = false; g.boss.vx = 0; g.boss.vy = 0; }
      setInterval(() => { if (g.boss) { g.boss.vx = 0; g.boss.vy = 0; } }, 100);
    }
  }, 1200);
})();
</script>
</body>
</html>
