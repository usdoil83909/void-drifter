<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>VOID DRIFTER</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-row">
    <div class="hud-block">
      <div class="hud-label">HULL</div>
      <div class="bar"><div id="hull-fill" class="bar-fill hull"></div></div>
    </div>
    <div class="hud-block">
      <div class="hud-label">SHIELD</div>
      <div class="bar"><div id="shield-fill" class="bar-fill shield"></div></div>
    </div>
    <div class="hud-spacer"></div>
    <div class="hud-stat">SCORE <span id="score">0</span></div>
    <div class="hud-stat">CRYSTALS <span id="crystals">0</span></div>
    <div class="hud-stat">WAVE <span id="wave">1</span></div>
  </div>
  <div id="boss-wrap" class="boss-wrap" style="display:none">
    <div class="hud-label">GUARDIAN</div>
    <div class="bar boss"><div id="boss-fill" class="bar-fill boss"></div></div>
  </div>
</div>

<div id="warning"></div>
<div id="overlay"></div>

<script src="input.js"></script>
<script src="audio.js"></script>
<script src="particles.js"></script>
<script src="entities.js"></script>
<script src="waves.js"></script>
<script src="hud.js"></script>
<script src="states.js"></script>
<script src="game.js"></script>
</body>
</html>
